<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | AI TITANS SOCIAL</title>

    <link rel="stylesheet" href="css/login.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- Left Side -->

    <div class="left">

        <h1>AI TITANS SOCIAL</h1>

        <h2>Welcome Back 👋</h2>

        <p>
            Login to manage your AI powered social media dashboard.
        </p>

        <img src="assets/dashboard.png" alt="Dashboard">

    </div>

    <!-- Right Side -->

    <div class="right">

        <div class="login-box">

            <h2>Login</h2>

            <!-- Form Start -->

            <form id="loginForm">

                <!-- Email -->

                <div class="input-box">

                    <i class="fa-solid fa-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        placeholder="Email Address"
                        required>

                </div>

                <!-- Password -->

               <div class="input-box">

    <i class="fa-solid fa-lock"></i>

    <input
        type="password"
        id="password"
        placeholder="Password"
        required
    >

    <i
        class="fa-solid fa-eye"
        id="togglePassword"
    ></i>

</div>

                <!-- Error Message -->

                <p id="errorMessage"></p>

                <a href="#" class="forgot" id="forgotPassword">
    Forgot Password?
</a>

                <button type="submit" id="loginBtn">

                    Login

                </button>

            </form>

            <!-- Form End -->

            <div class="divider">

                OR

            </div>

            <button class="google" id="googleBtn">

                <i class="fa-brands fa-google"></i>

                Continue with Google

            </button>

            <p class="signup">

    Don't have an account?

    <a href="signup.html">

        Create Account

    </a>

</p>

        </div>

    </div>

</div>

<script type="module" src="js/auth.js"></script>

</body>

</html>
