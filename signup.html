<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | AI TITANS SOCIAL</title>

    <link rel="stylesheet" href="css/signup.css">
</head>

<body>

<div class="container">

    <div class="signup-box">

        <h1>AI TITANS SOCIAL</h1>
        <p>Create your account</p>

        <form id="signupForm">

            <input
                type="text"
                id="name"
                placeholder="Full Name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm Password"
                required
            >

            <button type="submit">
                Create Account
            </button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

    </div>

</div>

<script type="module" src="js/signup.js"></script>

</body>
</html>
